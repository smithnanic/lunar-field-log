name: Fetch moon phase frames

# Downloads NASA's moon phase video from Wikimedia Commons, pulls out the frames
# listed in tools/moon-frames/frames.csv, and saves them to the nasa-raw branch.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/moon-frames/**'
      - '.github/workflows/moon-frames.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Download the video and extract frames
        run: python3 tools/moon-frames/fetch_frames.py out
      - name: Save frames to the nasa-raw branch
        if: always()
        run: |
          mkdir -p out && cd out
          git init -q -b nasa-raw
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q --allow-empty -m "Moon phase frames from NASA SVS via Wikimedia Commons"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" nasa-raw
